; Override SOLO per lo stack di test (docker-compose.v2-test.yml), raggiunto in HTTP semplice
; su una porta diretta, senza reverse proxy HTTPS davanti. Il Dockerfile reale imposta
; session.cookie_secure = 1 (corretto in produzione, sempre dietro HTTPS) — con quel valore il
; browser non rimanda mai indietro il cookie di sessione su una connessione HTTP, quindi ogni
; login sembra "buttare fuori" subito dopo l'accesso. Qui lo disattiviamo solo per poter testare.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 0
